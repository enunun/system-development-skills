[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"
# 版を変えたら`mise lock`を実行し，更新されたmise.lockもコミットする．

[settings]
lockfile = true

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.fmt]
description = "スキルのMarkdownを自動で整形する"
depends = ["install"]
run = "pnpm fmt"

[tasks.lint]
description = "すべてのリントを実行する"
depends = ["install"]
run = "pnpm lint"

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフックなど)"
depends = ["install", "hooks"]

[tasks.check]
description = "すべての検査をまとめて実行する"
depends = ["lint"]
